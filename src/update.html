<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WaterForm</title>
<link rel="stylesheet" href="shell.css">
<style>
  /* This window is small and is only ever this one card. */
  body { padding: 0; }
  .card { max-width: none; height: 100vh; border: 0; border-radius: 0; display: flex; flex-direction: column; justify-content: center; }
  .mark { display: none; }
  h1 { margin-top: 0; }
</style>
</head>
<body>
<main class="card">
  <h1 id="title"></h1>
  <p id="body"></p>
  <div class="bar" id="bar" hidden><i id="fill"></i></div>
  <div class="row">
    <button type="button" class="primary" id="ok" hidden></button>
    <button type="button" class="quiet" id="no" hidden></button>
  </div>
</main>
<script type="module" src="js/update.js"></script>
</body>
</html>
