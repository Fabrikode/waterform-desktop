name: release

# Merging dev into release is the release. Nothing else publishes anything.
#
# This repository is public for one reason: on a private repository a macOS
# runner minute counts ten times and a Windows one twice, so a single release
# would eat a tenth of the organisation's monthly allowance and share it with
# the application's own CI. There is nothing in here worth hiding: the shell
# holds no engineering code, no catalogue and no customer data.
on:
  push:
    branches: [release]

jobs:
  # A release the customers' machines are told about cannot be built from a
  # version that was never raised: the updater compares versions, so publishing
  # the same one twice would produce a release nobody is ever offered.
  gate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@12.0.2
      - id: read
        run: |
          node scripts/set-version.mjs --check
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::v$VERSION is already released. Raise the version with 'npm run version:set -- x.y.z' before merging into release."
            exit 1
          fi

  build:
    needs: gate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Same npm the lock file was written with. An older one reads esbuild's
      # optional platform packages as required and refuses to install.
      - run: npm install -g npm@12.0.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.args }}
      - name: Linux web view
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update packages. This is the shell's own key and has
          # nothing to do with Apple or Microsoft: without it a customer's
          # machine would install whatever the endpoint handed it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: WaterForm __VERSION__
          releaseBody: |
            Masaüstü kabuğu. Kurulu uygulamalar bunu kendileri alır; aşağıdaki dosyalar yeni kurulumlar içindir.

            The desktop shell. Installed copies update themselves; the files below are for new installations.

            macOS: ilk açılışta Sistem Ayarları > Gizlilik ve Güvenlik > "Yine de aç".
            Windows: SmartScreen > Daha fazla bilgi > Yine de çalıştır.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # Telling n8n, which records the release and mails us. Deliberately last and
  # deliberately unable to fail the release: the update path does not run through
  # n8n at all, so a webhook that is down costs a notification, never a release.
  notify:
    needs: [gate, build]
    runs-on: ubuntu-latest
    steps:
      - name: Tell n8n a release went out
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SECRET: ${{ secrets.N8N_RELEASE_SECRET }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "N8N_RELEASE_SECRET is not set, so nobody was told. The release itself is published."
            exit 0
          fi
          PAYLOAD=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" --jq '{
            version: (.tag_name | ltrimstr("v")),
            releaseUrl: .html_url,
            publishedAt: .published_at,
            notes: (.body // ""),
            files: [.assets[] | select(.name | test("\\.(dmg|exe|AppImage|deb)$")) | {name: .name, url: .browser_download_url, size: .size}]
          }')
          curl -sS --max-time 20 -X POST https://n8n.alany.co/webhook/waterform/desktop-release \
            -H "content-type: application/json" \
            -H "x-waterform-secret: $SECRET" \
            -d "$PAYLOAD" \
            || echo "n8n did not answer. The release is published; the notification is not."
