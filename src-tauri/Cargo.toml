[package]
name = "waterform-desktop"
version = "1.2.0"
description = "WaterForm desktop shell"
authors = ["Fabrikode"]
edition = "2021"
rust-version = "1.82"
publish = false

[lib]
name = "waterform_desktop"
path = "src/lib.rs"

[[bin]]
name = "waterform-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
sys-locale = "0.3"
# Only the timer: the update check waits ten seconds, then six hours at a time.
tokio = { version = "1", features = ["time"] }
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "charset",
  "http2",
  "rustls-tls-native-roots",
] }

# Printing on macOS: the web view there prints only when asked by the window,
# and Tauri's own call gives no signal when the dialog closes. The same versions
# wry already builds, so nothing new is downloaded.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSPrintInfo",
  "NSPrintOperation",
  "NSResponder",
  "NSView",
  "NSWindow",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
  "std",
  "objc2-app-kit",
  "WKWebView",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
